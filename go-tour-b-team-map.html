    5: [&#x27;lijiang&#x27;,&#x27;jade&#x27;], 6: [&#x27;lijiang&#x27;,&#x27;dali&#x27;], 7: [&#x27;dali&#x27;,&#x27;kunming&#x27;],

  let selectedDay = Number(window.openai?.widgetState?.modelContent?.selectedDay ?? 0);
  if (!Number.isInteger(selectedDay) || selectedDay &lt; 0 || selectedDay &gt; 8) selectedDay = 0;
  let cached = { width: 0, height: 0 };

  function curvePath(projection, segment) {
    const a = projection(places[segment.from].coord);
    const b = projection(places[segment.to].coord);
    const mx = (a[0] + b[0]) / 2;
    const my = (a[1] + b[1]) / 2;
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const length = Math.max(1, Math.hypot(dx, dy));
    const bend = segment.bend ?? Math.min(16, length * .08);
    const cx = mx - (dy / length) * bend;

    const box = root.querySelector(&#x27;.yn-map-wrap&#x27;).getBoundingClientRect();

    const height = Math.max(300, box.height);

      [[98.8,26.6],[100.2,25.2],[101.7,24.5],[104.2,24.2]],

      .data(segments)
      .join(&#x27;path&#x27;)

    groups.append(&#x27;circle&#x27;).attr(&#x27;class&#x27;,&#x27;yn-point-core&#x27;).attr(&#x27;r&#x27;, 2.5);
    groups.append(&#x27;text&#x27;).attr(&#x27;class&#x27;,&#x27;yn-map-label&#x27;).attr(&#x27;x&#x27;, ([,d]) =&gt; d.dx).attr(&#x27;y&#x27;, ([,d]) =&gt; d.dy).text(([,d]) =&gt; d.name);

        .attr(&#x27;transform&#x27;, &#x27;translate(-9,-9)&#x27;)

    root.querySelectorAll(&#x27;.yn-day&#x27;).forEach(btn =&gt; {

    root.querySelector(&#x27;#yn-map-meta&#x27;).textContent = d.meta;
    root.querySelector(&#x27;#yn-kicker&#x27;).textContent = d.kicker;
    root.querySelector(&#x27;#yn-detail-title&#x27;).textContent = d.title;

  root.querySelectorAll(&#x27;.yn-day&#x27;).forEach(btn =&gt; btn.addEventListener(&#x27;click&#x27;, () =&gt; update(Number(btn.dataset.day))));

    const day = Number(event.detail?.globals?.widgetState?.modelContent?.selectedDay);
    if (Number.isInteger(day) &amp;&amp; day &gt;= 0 &amp;&amp; day &lt;= 8 &amp;&amp; day !== selectedDay) update(day, false);

  }

  update(selectedDay, false);
})();
